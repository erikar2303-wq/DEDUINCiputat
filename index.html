<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kertas Kerja Evaluasi Kualifikasi – Perencana Gedung Asrama UIN Jakarta 2026</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1d2433; --muted:#5d6678; --line:#dde1e8;
  --brand:#14532d; --brand2:#166534; --brandSoft:#e8f3ec;
  --ok:#15803d; --okBg:#dcfce7; --bad:#b91c1c; --badBg:#fee2e2; --warn:#a16207; --warnBg:#fef3c7;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--brand);color:#fff;padding:14px 16px 10px}
header h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:12px;opacity:.85}
nav{position:sticky;top:0;z-index:5;background:var(--brand2);display:flex;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;color:#d7eadc;padding:11px 14px;font:inherit;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#fbbf24;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:14px 12px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.card h3{font-size:14px;margin:14px 0 8px}
.hint{color:var(--muted);font-size:12px;margin:4px 0 8px}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:700px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:1fr 1fr 1fr}.grid.c4{grid-template-columns:repeat(4,1fr)}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f span.l{font-weight:550}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);border:1px solid #c9ced8;border-radius:7px;padding:8px 9px;background:#fff;width:100%;min-width:0}
textarea{min-height:58px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #86efac;border-color:var(--brand2)}
input[type=checkbox]{width:auto}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0}
.chk input{margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brand2);background:var(--brand2);color:#fff;border-radius:8px;padding:8px 13px;font:inherit;font-size:13px;font-weight:550;cursor:pointer}
.btn.sec{background:#fff;color:var(--brand2)}
.btn.dan{background:#fff;color:var(--bad);border-color:#fca5a5}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--brandSoft);border-color:var(--brand2);color:var(--brand);font-weight:600}
.b{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:650;white-space:nowrap}
.b.ok{background:var(--okBg);color:var(--ok)} .b.bad{background:var(--badBg);color:var(--bad)} .b.na{background:#eef0f4;color:var(--muted)} .b.warn{background:var(--warnBg);color:var(--warn)}
.item{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;background:#fcfcfd}
.item .top{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.item .no{flex:0 0 auto;font-size:11px;color:var(--muted);background:#eef0f4;border-radius:5px;padding:2px 6px;margin-top:1px}
.item .tt{flex:1;font-weight:550;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 7px;vertical-align:top;text-align:left}
.tbl th{background:#f0f2f5;font-weight:600}
.tbl td.c,.tbl th.c{text-align:center}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.alert{border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.alert.warn{background:var(--warnBg);color:#713f12;border:1px solid #fde68a}
.alert.bad{background:var(--badBg);color:#7f1d1d;border:1px solid #fecaca}
.alert.ok{background:var(--okBg);color:#14532d;border:1px solid #bbf7d0}
.alert.info{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;z-index:50;max-width:92vw;box-shadow:0 6px 18px rgba(0,0,0,.25);display:none}
.status{font-size:11px;opacity:.85;margin-top:4px}
ul.r{margin:4px 0 0;padding-left:18px;font-size:12.5px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:11.5px;color:var(--muted)}
.dl{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:700px){.dl{grid-template-columns:1fr 1fr}}
.dl .card{margin:0}

/* ---- versi bersama: status, overlay, ponsel ---- */
.status.online{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block}
#loadingOv,#dlBox{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#dlBox{display:none}
.ovbox{background:#fff;border-radius:12px;padding:18px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ovbox p{margin:6px 0}
.ovbox .row{justify-content:center;margin-top:10px}
.spin{width:30px;height:30px;border:3px solid #d1fae5;border-top-color:var(--brand2);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
a.btn{text-decoration:none}
#loadingOv{background:#e9efea}
#pwBox{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:110;padding:16px}
.lnk{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:1px 8px;font:inherit;font-size:11px;cursor:pointer;margin-left:6px}
@media(max-width:640px){
  html,body{font-size:15px}
  header{padding:10px 12px 8px}
  header h1{font-size:14px}
  main{padding:10px 8px 90px}
  .card{padding:12px 10px}
  input,select,textarea{font-size:16px;padding:10px}
  .btn{padding:10px 14px;font-size:14px}
  .btn.sm{padding:7px 10px;font-size:13px}
  nav button{padding:12px 12px;font-size:13.5px}
  .row .btn{flex:1 1 auto;justify-content:center}
  .scroll{overflow:visible}
  .tbl,.tbl tbody{display:block;border:0}
  .tbl tr.hd{display:none}
  .tbl tr{display:block;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff;overflow:hidden}
  .tbl td{display:block;position:relative;padding:8px 8px 8px 40%;border:0;border-bottom:1px solid #eef0f4;text-align:left!important;min-width:0!important;min-height:34px}
  .tbl td:last-child{border-bottom:0}
  .tbl td::before{content:attr(data-label);position:absolute;left:8px;top:8px;width:calc(40% - 16px);font-weight:600;color:var(--muted);font-size:12px;line-height:1.3}
}
</style>

const LS_KEY = "kk-eval-kualifikasi-uin-asrama-2026";
function uid(){ return Math.random().toString(36).slice(2,9); }
function newEntity(nama, kual, share){ return {id:uid(), nama:nama||"", kual:kual||"Besar", share:share??"", npwp:"", alamat:"", adm:{}}; }
function newPeserta(){

    ents:[newEntity("", "Besar", 100)], ksoAda:"", ksoIsi:{}, ksoKet:"",
    kinerja:"", kinerjaSumber:"SIKaP", kinerjaKet:"", exps:[], catatanEval:"",

function newExp(){ return {id:uid(), ent:0, nama:"", lingkup:"", subklas:"", lokasi:"", pemberi:"", noKontrak:"", tglKontrak:"", nilai:"", status:"Penyedia Tunggal", share:"", tglBAST:"", jkk:true, sejB:false, sejC:false, referensi:false, bukti:"", ket:""}; }
function defaultState(){
  return {v:1, paket:{...DEFAULT_PAKET}, param:{...DEFAULT_PARAM},
    pokjaAnggota:[{nama:"",nip:"",jabatan:"Ketua"},{nama:"",nip:"",jabatan:"Sekretaris"},{nama:"",nip:"",jabatan:"Anggota"}],
    peserta:[], ui:{tab:"paket", sel:null}, updatedAt:0};
}
let S = defaultState();
function migrate(o){
  const d = defaultState();
  const s = Object.assign(d, o||{});
  s.paket = Object.assign({...DEFAULT_PAKET}, s.paket||{});
  s.param = Object.assign({...DEFAULT_PARAM}, s.param||{});
  s.ui = Object.assign({tab:"paket", sel:null}, s.ui||{});
  s.peserta = (s.peserta||[]).map(p=>{
    const n = Object.assign(newPeserta(), p);
    n.pb = Object.assign(newPeserta().pb, p.pb||{});
    n.pb.items = n.pb.items||{};
    n.ents = (n.ents && n.ents.length ? n.ents : [newEntity()]).map(e=>Object.assign(newEntity(), e, {adm:e.adm||{}}));
    n.exps = (n.exps||[]).map(x=>Object.assign(newExp(), x));
    return n;
  });
  return s;
}
/* ===== SINKRONISASI BERSAMA (Supabase) =====
   - Login: tautan masuk via email (opsional: akun Google), lihat config.js.
   - Data: tabel meta (paket/parameter/anggota Pokja) dan peserta (satu baris per peserta).
   - Simpan: hanya isian yang berubah dikirim ke fungsi public.simpan() dan digabung di server.
   - Realtime: perubahan anggota lain diterima seketika; cadangan pengecekan tiap 20 detik. */
try{ const u = JSON.parse(localStorage.getItem(LS_KEY+"-ui")||"null"); if(u) S.ui = Object.assign(S.ui, u); }catch(e){}
let DL = null;
if(!window.KK_CONFIG || /xxxx/.test(window.KK_CONFIG.SUPABASE_URL||"") || /TEMPEL/i.test(window.KK_CONFIG.SUPABASE_ANON_KEY||"")) window.KK_CONFIG = window.KK_CONFIG_EMBED;
const CFG = window.KK_CONFIG || {};
const SY = { base:{}, baseOrder:[], since:null, me:"", nama:"", inflight:false, dirty:false, timer:null, ready:false,
             pendingRender:false, online:[], err:0, needPoll:false, queue:[] };
let SB = null;
function setStatus(t){ const el = document.getElementById("saveStatus"); if(el) el.textContent = t; }
function metaObj(){ return {paket:S.paket, param:S.param, pokjaAnggota:S.pokjaAnggota}; }
function isObj(x){ return x!==null && typeof x==="object" && !Array.isArray(x); }
function diff(a, b, path, ops){
  if(isObj(a) && isObj(b)){
    const ks = new Set([...Object.keys(a), ...Object.keys(b)]);
    ks.forEach(k=>{ if(!(k in b)) ops.push({p:path.concat(k), d:1}); else diff(a[k], b[k], path.concat(k), ops); });
    return ops;
  }
  if(Array.isArray(a) && Array.isArray(b)){
    const same = a.length===b.length && a.every((x,i)=> !(isObj(x)&&isObj(b[i])&&("id" in x || "id" in b[i])) || x.id===b[i].id);
    if(same){ a.forEach((x,i)=>diff(x, b[i], path.concat(i), ops)); return ops; }
    ops.push({p:path, v:b}); return ops;
  }
  if(a!==b && JSON.stringify(a)!==JSON.stringify(b)) ops.push({p:path, v:b===undefined? null : b});
  return ops;
}
function applyOps(obj, ops){
  ops.forEach(op=>{
    const p = op.p||[]; if(!p.length) return; let o = obj;
    for(let i=0;i<p.length-1;i++){ const k = p[i]; if(o[k]===null || typeof o[k]!=="object") o[k] = typeof p[i+1]==="number"? [] : {}; o = o[k]; }
    const last = p[p.length-1];
    if(op.d){ if(Array.isArray(o)) o.splice(last,1); else delete o[last]; } else o[last] = op.v;
  });
  return obj;
}
const clone = o => JSON.parse(JSON.stringify(o));
function summary(p){ try{ const e = evalResult(p); return {nama:pName(p), bentuk:p.bentuk, admin:e.ad, total:e.t.total, hasil:e.hasil}; }catch(e){ return {nama:pName(p)}; } }
function userEditing(){ const a = document.activeElement; return !!(a && a.closest && a.closest("#view") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
function softRender(){ if(userEditing()) SY.pendingRender = true; else render(); }
document.addEventListener("focusout", ()=>setTimeout(()=>{ if(SY.pendingRender && !userEditing()){ SY.pendingRender = false; render(); } }, 50));
function bump(ts){ const t = ts? Date.parse(ts) : NaN; if(isFinite(t) && (!SY.sinceMs || t > SY.sinceMs)){ SY.sinceMs = t; SY.since = new Date(t - 1).toISOString(); } }

/* baris server -> rekaman seragam */
function recP(r){ return {id:r.id, ver:r.ver, urut:r.urut, del: !!(r.del ?? r.dihapus), data: r.data, at: r.at || r.diubah_pada}; }
function adoptMeta(m){
  if(!m || !m.data) return false;
  const local = metaObj();
  const pending = SY.base.meta ? diff(JSON.parse(SY.base.meta.json), local, [], []) : [];
  const merged = applyOps(clone(m.data), pending);
  const mm = migrate(merged); S.paket = mm.paket; S.param = mm.param; S.pokjaAnggota = merged.pokjaAnggota || S.pokjaAnggota;
  SY.base.meta = {ver:m.ver, json:JSON.stringify(m.data)};
  bump(m.at || m.diubah_pada);
  return true;
}
function adoptPeserta(r){
  r = recP(r); bump(r.at);
  const k = S.peserta.findIndex(p=>p.id===r.id), b = SY.base[r.id];
  if(b && b.ver >= r.ver && !r.del) return false;
  if(r.del){
    if(k<0 && !b) return false;
    if(k>=0) S.peserta.splice(k,1);
    delete SY.base[r.id]; return true;
  }
  let merged = r.data;
  if(k>=0 && b){ const pending = diff(JSON.parse(b.json), S.peserta[k], [], []); merged = applyOps(clone(r.data), pending); }
  const np = migrate({peserta:[merged]}).peserta[0];
  if(k>=0) S.peserta[k] = np; else S.peserta.push(np);
  SY.base[r.id] = {ver:r.ver, json:JSON.stringify(r.data), urut:r.urut};
  return true;
}
function reorder(){
  const u = id => (SY.base[id] && SY.base[id].urut) || 1e9;
  const pos = new Map(S.peserta.map((p,i)=>[p.id,i]));
  S.peserta.sort((a,b)=> (u(a.id)-u(b.id)) || (pos.get(a.id)-pos.get(b.id)));
  SY.baseOrder = S.peserta.filter(p=>SY.base[p.id]).map(p=>p.id);
}
function showOnline(){
  const el = document.getElementById("onlineBar"); if(!el) return;
  const others = SY.online.filter(x=>x!==SY.me);
  el.innerHTML = `<span class="dot"></span> ${esc(SY.nama||SY.me)}` + (others.length? ` · juga membuka: ${others.map(esc).join(", ")}` : "") +

  const b = document.getElementById("btnLogout"); if(b) b.onclick = async ()=>{ await flushNow(); await SB.auth.signOut(); location.reload(); };
}

function save(){
  S.updatedAt = Date.now();
  try{ localStorage.setItem(LS_KEY+"-ui", JSON.stringify(S.ui)); }catch(e){}
  if(!SY.ready) return;
  SY.dirty = true; clearTimeout(SY.timer); SY.timer = setTimeout(flush, 1000);
}
async function flushNow(){ clearTimeout(SY.timer); while(SY.inflight) await new Promise(r=>setTimeout(r,100)); await flush(); }
async function flush(){
  if(!SY.ready || SY.inflight || !SY.dirty) return;
  SY.dirty = false;
  const batch = {meta:null, peserta:[], del:[], order:null};
  if(SY.base.meta){ const ops = diff(JSON.parse(SY.base.meta.json), metaObj(), [], []); if(ops.length) batch.meta = {ops}; }
  S.peserta.forEach((p,i)=>{
    const b = SY.base[p.id];
    if(!b){ batch.peserta.push({id:p.id, full:JSON.stringify(p), urut:i+1, sum:summary(p)}); return; }
    const ops = diff(JSON.parse(b.json), p, [], []);
    if(ops.length) batch.peserta.push({id:p.id, ops, sum:summary(p)});
  });
  const ids = new Set(S.peserta.map(p=>p.id));
  Object.keys(SY.base).forEach(id=>{ if(id!=="meta" && !ids.has(id)) batch.del.push(id); });
  const ord = S.peserta.filter(p=>SY.base[p.id]).map(p=>p.id);
  if(ord.join("|") !== SY.baseOrder.filter(id=>ids.has(id)).join("|")) batch.order = S.peserta.map(p=>p.id);
  if(!batch.meta && !batch.peserta.length && !batch.del.length && !batch.order){ setStatus("Semua perubahan tersimpan · " + new Date().toLocaleTimeString("id-ID")); return; }
  SY.inflight = true; setStatus("Menyimpan…");
  try{
    const { data:res, error } = await SB.rpc("simpan", { batch });
    if(error) throw error;
    if(res.meta) adoptMeta(res.meta);
    (res.peserta||[]).forEach(adoptPeserta);
    reorder(); SY.err = 0;
    setStatus("Tersimpan bersama · " + new Date().toLocaleTimeString("id-ID"));
    softRender();
  }catch(e){
    SY.dirty = true; SY.err++;
    setStatus("Gagal menyimpan (" + (e && (e.message||e.code) || "galat") + "). Mencoba lagi…");
    clearTimeout(SY.timer); SY.timer = setTimeout(flush, Math.min(15000, 2000*SY.err));
  }finally{ SY.inflight = false; }
  if(SY.dirty){ clearTimeout(SY.timer); SY.timer = setTimeout(flush, 600); }
  else if(SY.queue.length || SY.needPoll){ drainQueue(); }
}
/* perubahan dari anggota lain */
function incoming(kind, row){
  if(!SY.ready || !row) return;
  if(SY.inflight || SY.dirty){ SY.queue.push([kind,row]); return; }
  let ch = false;
  if(kind==="meta"){ if(!SY.base.meta || row.ver !== SY.base.meta.ver) ch = adoptMeta(row); }
  else ch = adoptPeserta(row);
  if(ch){ reorder(); softRender(); setStatus("Diperbarui dari anggota lain · " + new Date().toLocaleTimeString("id-ID")); }
}
function drainQueue(){ const q = SY.queue.splice(0); q.forEach(([k,r])=>incoming(k,r)); if(SY.needPoll){ SY.needPoll = false; poll(); } }
async function poll(){
  if(!SY.ready || SY.inflight || SY.dirty || document.hidden) { SY.needPoll = true; return; }
  try{
    let q = SB.from("peserta").select("id,urut,data,ver,dihapus,diubah_pada");
    if(SY.since) q = q.gt("diubah_pada", SY.since);
    const { data:rows, error } = await q; if(error) throw error;
    const { data:m } = await SB.from("meta").select("*").eq("id","meta").maybeSingle();
    if(SY.inflight || SY.dirty){ SY.needPoll = true; return; }
    let ch = false;
    if(m && (!SY.base.meta || m.ver !== SY.base.meta.ver)) ch = adoptMeta(m) || ch;
    (rows||[]).forEach(r=>{ ch = adoptPeserta(r) || ch; });
    if(ch){ reorder(); softRender(); setStatus("Diperbarui dari anggota lain · " + new Date().toLocaleTimeString("id-ID")); }
  }catch(e){ setStatus("Koneksi terputus, mencoba lagi…"); }
}

async function startShared(){
  const ov = document.getElementById("loadingOv");
  ov.innerHTML = `<div class="ovbox"><div class="spin"></div><b>Memuat data bersama Pokja…</b></div>`;
  const { data:me, error:e1 } = await SB.rpc("saya");
  if(e1){ fatal("Gagal menghubungi server: " + esc(e1.message)); return; }
  if(!me.anggota){ fatal(`Akun <b>${esc(me.email)}</b> belum terdaftar sebagai anggota Pokja. Hubungi Ketua/Sekretaris Pokja agar email Anda ditambahkan.`); return; }
  SY.me = me.email; SY.nama = me.nama ? `${me.nama} (${me.email})` : me.email;
  const { data:m, error:e2 } = await SB.from("meta").select("*").eq("id","meta").maybeSingle();
  const { data:rows, error:e3 } = await SB.from("peserta").select("id,urut,data,ver,dihapus,diubah_pada").eq("dihapus", false).order("urut");
  if(e2 || e3){ fatal("Gagal memuat data: " + esc((e2||e3).message)); return; }
  const ui = S.ui; S = defaultState(); S.ui = ui;
  if(m && m.data && Object.keys(m.data).length) adoptMeta(m); else SY.base.meta = {ver:0, json:"{}"};
  (rows||[]).forEach(adoptPeserta);
  reorder();
  SY.ready = true;
  if(!m || !m.data || !Object.keys(m.data).length) save();     // simpan data paket bawaan pertama kali
  ov.remove(); render(); showOnline();
  setStatus("Terhubung · data bersama Pokja");
  // realtime
  SB.channel("kk-data")
    .on("postgres_changes", { event:"*", schema:"public", table:"peserta" }, p=> incoming("peserta", p.new))
    .on("postgres_changes", { event:"*", schema:"public", table:"meta" }, p=> incoming("meta", p.new))
    .subscribe(st=>{ if(st==="SUBSCRIBED") poll(); });
  const pres = SB.channel("kk-online", { config:{ presence:{ key: SY.me } } });
  pres.on("presence", { event:"sync" }, ()=>{ SY.online = Object.keys(pres.presenceState()); showOnline(); })
      .subscribe(async st=>{ if(st==="SUBSCRIBED") await pres.track({ at: Date.now() }); });
  setInterval(poll, 20000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) poll(); });
}
(async function initShared(){
  if(!(window.supabase && supabase.createClient)){ fatal("Pustaka Supabase gagal dimuat. Periksa koneksi internet."); return; }
  const cfgUrl = new URL("config.js", location.href).href;
  const cfgLink = `<br><a href="${cfgUrl}" target="_blank" rel="noopener">${esc(cfgUrl)}</a>`;
  if(!window.KK_CONFIG){ fatal("Berkas <b>config.js</b> tidak ditemukan di alamat ini atau isinya salah ketik (tanda kutip/koma/kurung terhapus). Buka:" + cfgLink); return; }
  if(!CFG.SUPABASE_URL || /xxxx/.test(CFG.SUPABASE_URL)){ fatal("<b>SUPABASE_URL</b> di config.js masih contoh/kosong. Berkas yang terbaca:" + cfgLink); return; }
  if(!CFG.SUPABASE_ANON_KEY || /TEMPEL/i.test(CFG.SUPABASE_ANON_KEY)){ fatal("<b>SUPABASE_ANON_KEY</b> di config.js belum diisi (masih TEMPEL_...). Isi dengan Publishable key / anon key. Berkas yang terbaca:" + cfgLink); return; }
  CFG.SUPABASE_URL = CFG.SUPABASE_URL.trim().replace(/\/rest\/v1\/?$/,"").replace(/\/+$/,"");
  CFG.SUPABASE_ANON_KEY = CFG.SUPABASE_ANON_KEY.trim();
  SB = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  let started = false;
  const go = async (session)=>{ if(session && !started){ started = true; await startShared(); } };
  SB.auth.onAuthStateChange((ev, session)=>{ if(session) go(session); });
  const { data } = await SB.auth.getSession();
  if(data && data.session) go(data.session); else loginScreen("");
})();

const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ if(v===""||v==null) return NaN; const n = typeof v==="number"? v : parseFloat(String(v).replace(/\./g,"").replace(",", ".")); return isFinite(n)? n : NaN; }
function numPlain(v){ if(v===""||v==null) return NaN; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n)? n : NaN; }
function rp(n){ n = num(n); if(!isFinite(n)) return "-"; return "Rp" + n.toLocaleString("id-ID",{minimumFractionDigits:2, maximumFractionDigits:2}); }
function pd(s){ if(!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m? new Date(Date.UTC(+m[1], +m[2]-1, +m[3])) : null; }
function tglID(s){ const d = pd(s); return d? d.getUTCDate()+" "+BULAN[d.getUTCMonth()]+" "+d.getUTCFullYear() : "…………"; }
function tglShort(s){ const d = pd(s); return d? String(d.getUTCDate()).padStart(2,"0")+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+d.getUTCFullYear() : ""; }
function terbilang(n){
  n = Math.floor(n);
  const s = ["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
  if(n < 12) return s[n];
  if(n < 20) return terbilang(n-10) + " belas";
  if(n < 100) return terbilang(Math.floor(n/10)) + " puluh" + (n%10? " " + terbilang(n%10) : "");
  if(n < 200) return "seratus" + (n-100? " " + terbilang(n-100) : "");
  if(n < 1000) return terbilang(Math.floor(n/100)) + " ratus" + (n%100? " " + terbilang(n%100) : "");
  if(n < 2000) return "seribu" + (n-1000? " " + terbilang(n-1000) : "");
  if(n < 1e6) return terbilang(Math.floor(n/1000)) + " ribu" + (n%1000? " " + terbilang(n%1000) : "");
  if(n < 1e9) return terbilang(Math.floor(n/1e6)) + " juta" + (n%1e6? " " + terbilang(n%1e6) : "");
  return terbilang(Math.floor(n/1e9)) + " miliar" + (n%1e9? " " + terbilang(n%1e9) : "");
}
function cap(s){ return s.replace(/\b\w/g, c=>c.toUpperCase()); }
function getPath(o, path){ return path.split(".").reduce((a,k)=> a==null? a : a[k], o); }
function setPath(o, path, v){ const ks = path.split("."); let a = o; for(let i=0;i<ks.length-1;i++){ if(a[ks[i]]==null) a[ks[i]] = {}; a = a[ks[i]]; } a[ks[ks.length-1]] = v; }
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(()=>el.style.display="none", 3200); }
function badge(r){
  const ok = ["M","MEMENUHI","LULUS","Sesuai","Terbukti","Ya"], bad = ["TM","TIDAK MEMENUHI","GUGUR","TIDAK LULUS","Tidak Sesuai","Tidak Terbukti","Tidak"];
  const c = ok.includes(r)? "ok" : bad.includes(r)? "bad" : (r==="BELUM LENGKAP"||r==="BELUM DINILAI")? "warn" : "na";
  return `<span class="b ${c}">${esc(r||"-")}</span>`;
}
function pName(p){ return p.bentuk==="KSO" ? (p.namaKSO || p.nama || "(KSO tanpa nama)") : (p.nama || "(tanpa nama)"); }
function eName(p, i){ return p.bentuk==="KSO" ? (p.ents[i]?.nama || ("Anggota " + (i+1))) : (p.nama || "(tanpa nama)"); }
function ents(p){ return p.bentuk==="KSO" ? p.ents : p.ents.slice(0,1); }

const KUAL_RANK = {Kecil:1, Menengah:2, Besar:3};
function admItem(p, ei, it){
  const d = (p.ents[ei].adm[it.k]) || {};
  if(it.special==="sbu") return sbuEntity(p, ei);
  let r = "-", note = "";
  const o = (OPTS[it.opt]||[]).find(x=>x[0]===d.ada);
  if(o){ r = o[1]; }
  if(r==="M" && it.berlaku && d.berlaku && d.berlaku < batasDate()){ r = "TM"; note = "Masa berlaku habis sebelum batas akhir pemasukan"; }
  if(d.hasil==="M"||d.hasil==="TM"){ r = d.hasil; note = note || "Ditetapkan manual oleh Pokja"; }
  return {r, note};
}
function sbuEntity(p, ei){
  const d = p.ents[ei].adm.sbu || {};
  let r = "-", note = "";
  if(d.kual){
    const valid = !(d.berlaku && d.berlaku < batasDate()) && !(d.berlakuRK && d.berlakuRK < batasDate());
    if(!valid){ r = "TM"; note = "Masa berlaku SBU habis sebelum batas akhir pemasukan"; }
    else if(p.bentuk!=="KSO"){
      if(d.kual!=="Besar"){ r="TM"; note="Kualifikasi SBU bukan Usaha Besar"; }
      else if(!(d.ar && d.rk)){ r="TM"; note="Tidak memiliki "+[!d.ar&&"AR001",!d.rk&&"RK001"].filter(Boolean).join(" & "); }
      else r = "M";
    } else {
      if(!(d.ar || d.rk)){ r="TM"; note="Anggota KSO wajib memiliki salah satu SBU yang disyaratkan"; }
      else if(!KUAL_RANK[d.kual] || KUAL_RANK[d.kual] < 2){ r="TM"; note="Kualifikasi Kecil tidak dapat ber-KSO pada paket Usaha Besar"; }
      else r = "M";
    }
  }
  if(d.hasil==="M"||d.hasil==="TM"){ r = d.hasil; note = note || "Ditetapkan manual oleh Pokja"; }
  return {r, note};
}
function ksoRows(p){
  if(p.bentuk!=="KSO") return [];
  const P = S.param, es = p.ents, lead = es[0]||{};
  const rows = [];
  const ada = p.ksoAda==="Ada"? "M" : p.ksoAda==="Tidak Ada"? "TM" : "-";
  rows.push({k:"kso1", no:"A.6", t:"Surat Perjanjian KSO (asli) diunggah", r:ada, note:""});
  const isiAll = KSO_CONTENT.every(([k])=>p.ksoIsi[k]);
  const isiAny = KSO_CONTENT.some(([k])=>p.ksoIsi[k]);
  rows.push({k:"kso2", no:"IKP 3.8", t:"Isi Perjanjian KSO memuat huruf a s.d. e", r: isiAll? "M" : (p.ksoAda? "TM":"-"), note: isiAll? "" : (isiAny||p.ksoAda ? "Belum lengkap: " + KSO_CONTENT.filter(([k])=>!p.ksoIsi[k]).map(x=>x[0]).join(", ") : "")});
  rows.push({k:"kso3", no:"LDK D", t:"Jumlah anggota KSO paling banyak "+P.maxKSO+" perusahaan", r: es.length<=P.maxKSO && es.length>=2? "M":"TM", note: es.length+" perusahaan"});
  const shares = es.map(e=>numPlain(e.share));
  const sum = shares.reduce((a,b)=>a+(isFinite(b)?b:0),0);
  rows.push({k:"kso4", no:"Bab VI", t:"Total pembagian modal (sharing) = 100%", r: shares.every(isFinite) ? (Math.abs(sum-100)<0.001? "M":"TM") : "-", note:"Total "+sum+"%"});
  const ls = shares[0], others = shares.slice(1);
  let r5 = "-", n5 = "";
  if(isFinite(ls) && others.every(isFinite)){
    const maj = others.every(x=>ls > x);
    r5 = (maj && ls <= P.maxLeadShare)? "M" : "TM";
    n5 = "Leadfirm "+ls+"%" + (!maj? " (bukan porsi terbesar)":"") + (ls>P.maxLeadShare? " (melebihi "+P.maxLeadShare+"%)":"");
  }
  rows.push({k:"kso5", no:"IKP 3.12", t:"Leadfirm memiliki porsi modal mayoritas dan paling banyak "+P.maxLeadShare+"%", r:r5, note:n5});
  const kr = es.map(e=>KUAL_RANK[e.kual]||0);
  let r6 = "M", n6 = [];
  if(kr[0]!==3){ r6="TM"; n6.push("Leadfirm harus berkualifikasi Besar"); }
  if(kr.some(x=>x>kr[0])){ r6="TM"; n6.push("Leadfirm harus setingkat atau lebih tinggi dari anggota"); }
  if(kr.some(x=>x<2)){ r6="TM"; n6.push("Anggota berkualifikasi Kecil tidak memenuhi IKP 3.11"); }
  rows.push({k:"kso6", no:"IKP 3.11–3.12", t:"Kualifikasi anggota setingkat, atau Besar dengan Menengah (1 tingkat di bawah); leadfirm setingkat atau lebih tinggi", r:r6, note:n6.join("; ")});
  // SBU saling melengkapi
  const sb = es.map(e=>e.adm.sbu||{});
  let r7 = "-", n7 = "";
  if(sb.every(d=>d.kual)){
    const valid = sb.every(d=>!(d.berlaku && d.berlaku < batasDate()));
    const setara = kr.every(x=>x===kr[0]);
    if(!valid){ r7="TM"; n7="Ada SBU yang masa berlakunya habis"; }
    else if(!sb.every(d=>d.ar||d.rk)){ r7="TM"; n7="Setiap anggota wajib memiliki salah satu SBU yang disyaratkan"; }
    else if(setara){ r7 = (sb.some(d=>d.ar) && sb.some(d=>d.rk))? "M":"TM"; n7 = r7==="M"? "Kualifikasi setara; AR001 & RK001 terpenuhi secara saling melengkapi" : "AR001/RK001 belum terpenuhi gabungan anggota"; }
    else { r7 = (sb[0].ar && sb[0].rk && sb[0].kual==="Besar")? "M":"TM"; n7 = "Kualifikasi tidak setara: AR001 & RK001 Besar wajib dipenuhi leadfirm"; }
  }
  rows.push({k:"kso7", no:"LDK (KSO) 2", t:"SBU yang disyaratkan dipenuhi secara saling melengkapi oleh anggota KSO", r:r7, note:n7});
  rows.forEach(x=>{ const ov = (p.ksoOv||{})[x.k]; if(ov==="M"||ov==="TM"){ x.r = ov; x.note = x.note || "Ditetapkan manual oleh Pokja"; } });
  return rows;
}
function admRowsAll(p){
  const out = [];
  ents(p).forEach((e,ei)=>{
    ADM.forEach(it=>{ const res = admItem(p, ei, it); out.push({ei, ent:eName(p,ei), it, ...res, d:p.ents[ei].adm[it.k]||{}}); });
  });
  ksoRows(p).forEach(x=>out.push({ei:-1, ent:"KSO", it:{k:x.k, no:x.no, t:x.t}, r:x.r, note:x.note, d:{}}));
  return out;
}
function admResult(p){
  const rows = admRowsAll(p);
  if(rows.some(x=>x.r==="TM")) return "TIDAK MEMENUHI";
  if(rows.some(x=>x.r!=="M")) return "BELUM LENGKAP";
  return "MEMENUHI";
}
function admReasons(p){ return admRowsAll(p).filter(x=>x.r==="TM").map(x=>(p.bentuk==="KSO"? x.ent+": " : "") + shortT(x.it.t) + (x.note? " ("+x.note+")":"")); }
function shortT(t){ return t.length>80? t.slice(0,78)+"…" : t; }

function expWeighted(x){ const n = num(x.nilai); if(!isFinite(n)) return 0; if(x.status==="KSO"){ const s = numPlain(x.share); return isFinite(s)? n*s/100 : 0; } return n; }
function expFlags(x){
  const b = x.tglBAST, end = batasDate();
  const in4 = !!b && b >= S.param.awal4 && b <= end;
  const in10 = !!b && b >= S.param.awal10 && b <= end;
  const subOk = x.status!=="Subkontrak" || x.referensi;
  return {a: !!x.jkk && in4 && subOk, b: !!x.sejB && in10 && subOk, c: !!x.sejC && in10 && subOk, in4, in10, subOk};
}
function tierA(n){ return n>=10?20 : n>=5?10 : n>=1?5 : 0; }
function tierB(n){ return n>=10?30 : n>=5?20 : n>=1?10 : 0; }
function tierC(n){ return n>=10?40 : n>=5?30 : n>=1?20 : 0; }
function tierD(k){ return !isFinite(k)? 0 : k>=3?10 : k>=2?5 : 0; }
function teknis(p, proof){
  const P = S.param;
  const xs = p.exps.filter(x=> !proof || x.bukti==="Terbukti");
  const F = xs.map(x=>({x, f:expFlags(x)}));
  const a = F.filter(o=>o.f.a).length, b = F.filter(o=>o.f.b).length, c = F.filter(o=>o.f.c).length;
  let allA = "-";
  if(p.bentuk==="KSO"){ allA = p.ents.every((e,i)=>F.some(o=>o.f.a && +o.x.ent===i)) ? "Ya" : "Tidak"; }
  const k = numPlain(p.kinerja);
  const minA = (a>=1 && allA!=="Tidak")? "M":"TM", minB = b>=1? "M":"TM", minC = c>=1? "M":"TM", minD = (isFinite(k) && k>=P.minKinerja)? "M":"TM";
  const na = tierA(a), nb = tierB(b), nc = tierC(c), nd = tierD(k);
  const total = na+nb+nc+nd;
  const minOk = [minA,minB,minC,minD].every(x=>x==="M");
  const okB = nb >= P.ambangB, okC = nc >= P.ambangC, okT = total >= P.ambangTotal;
  const lulus = minOk && okB && okC && okT;
  const rs = [];
  if(minA==="TM") rs.push(allA==="Tidak"? "Tidak seluruh anggota KSO memiliki pengalaman Jasa Konsultansi Konstruksi 4 tahun terakhir" : "Tidak memiliki pengalaman Jasa Konsultansi Konstruksi 4 tahun terakhir");
  if(minB==="TM") rs.push("Tidak memiliki pengalaman pekerjaan sejenis (subklasifikasi/lingkup)");
  if(minC==="TM") rs.push("Tidak memiliki pengalaman sejenis perencanaan gedung pendidikan 10 tahun terakhir");
  if(minD==="TM") rs.push("Nilai kinerja penyedia di bawah Baik / tidak ada penilaian");
  if(minOk && !okB) rs.push("Nilai unsur b ("+nb+") di bawah ambang batas "+P.ambangB);
  if(minOk && !okC) rs.push("Nilai unsur c ("+nc+") di bawah ambang batas "+P.ambangC);
  if(minOk && !okT) rs.push("Jumlah nilai ("+total+") di bawah ambang batas "+P.ambangTotal);
  // nilai kontrak pekerjaan sejenis tertinggi (leadfirm untuk KSO)
  const top = Math.max(0, ...F.filter(o=>(o.f.b||o.f.c) && +o.x.ent===0).map(o=>expWeighted(o.x)));
  return {a,b,c,allA,k,minA,minB,minC,minD,na,nb,nc,nd,total,okB,okC,okT,lulus,hasil: lulus? "LULUS":"TIDAK LULUS", reasons:rs, top};
}
function evalResult(p){
  const ad = admResult(p), t = teknis(p,false);
  const lulus = ad==="MEMENUHI" && t.lulus;
  return {ad, t, lulus, hasil: lulus? "LULUS" : (ad==="BELUM LENGKAP"? "BELUM LENGKAP" : "GUGUR")};
}
function pbItemsFor(p){ return PB.filter(it=> it.k!=="kso" || p.bentuk==="KSO"); }
function pembuktian(p){
  const e = evalResult(p);
  const t = teknis(p, true);
  const pb = p.pb, rs = [];
  if(!e.lulus) return {invited:false, hasil:"-", t, reasons:["Tidak lulus evaluasi kualifikasi"]};
  if(!pb.hadir) return {invited:true, hasil:"BELUM DINILAI", t, reasons:[]};
  if(pb.hadir==="Tidak Hadir"){ return {invited:true, hasil:"GUGUR", t, reasons:["Tidak hadir/tidak memenuhi undangan pembuktian kualifikasi"]}; }
  const items = pbItemsFor(p);
  const blank = items.filter(it=>!pb.items[it.k]);
  const bad = items.filter(it=>pb.items[it.k]==="Tidak Sesuai");
  bad.forEach(it=>rs.push("Tidak sesuai: " + shortT(it.t)));
  if(pb.pemalsuan) rs.push("Ditemukan indikasi pemalsuan dokumen — diusulkan sanksi Daftar Hitam");
  const unproven = p.exps.filter(x=>!x.bukti);
  if(!t.lulus && !unproven.length) rs.push("Setelah pembuktian pengalaman: " + (t.reasons.join("; ") || "tidak memenuhi"));
  let hasil;
  if(bad.length || pb.pemalsuan) hasil = "GUGUR";
  else if(blank.length || unproven.length) hasil = "BELUM DINILAI";
  else hasil = t.lulus? "LULUS" : "GUGUR";
  return {invited:true, hasil, t, reasons:rs, blank:blank.length, unproven:unproven.length};
}
function ranking(){
  const rows = S.peserta.map(p=>({p, e:evalResult(p), b:pembuktian(p)}));
  const pass = rows.filter(r=>r.b.hasil==="LULUS");
  pass.sort((x,y)=> (y.b.t.total - x.b.t.total) || (y.b.t.top - x.b.t.top));
  pass.forEach((r,i)=>{ r.rank = i+1; r.shortlist = i < S.param.maxShortlist; r.tie = pass.some(o=>o!==r && o.b.t.total===r.b.t.total); });
  return {rows, pass};
}

  const v = getPath(S, path) ?? "";

  if(t==="select") return `<label class="f"><span class="l">${label}</span><select data-path="${path}" ${opt.num?'data-num="1"':""}>${(opt.blank!==false?'<option value="">— pilih —</option>':"")}${opt.options.map(o=>{const [val,lab] = Array.isArray(o)? o : [o,o]; return `<option value="${esc(val)}" ${String(v)===String(val)?"selected":""}>${esc(lab)}</option>`;}).join("")}</select></label>`;
  if(t==="textarea") return `<label class="f"><span class="l">${label}</span><textarea data-path="${path}" placeholder="${esc(opt.ph||"")}">${esc(v)}</textarea></label>`;
  if(t==="check") return `<label class="chk"><input type="checkbox" data-path="${path}" ${v?"checked":""}><span>${label}</span></label>`;

function labelTables(){
  document.querySelectorAll("#view table.tbl").forEach(t=>{
    const grid = []; let r = 0;
    const hrows = [...t.rows].filter(tr=>tr.querySelector("th") && !tr.querySelector("td"));
    hrows.forEach(tr=>{ tr.classList.add("hd"); grid[r] = grid[r]||[]; let c = 0;
      [...tr.cells].forEach(th=>{ while(grid[r][c]) c++; const rs = th.rowSpan||1, cs = th.colSpan||1;
        for(let i=0;i<rs;i++) for(let j=0;j<cs;j++){ grid[r+i] = grid[r+i]||[]; grid[r+i][c+j] = {t:th.textContent.trim(), top:i===0 && rs>1 ? true : false, span:cs>1}; }
        c += cs; }); r++; });
    const ncol = Math.max(0, ...grid.map(g=>g.length));
    const labels = []; for(let c=0;c<ncol;c++){ const parts = []; grid.forEach(g=>{ const x = g[c]; if(x && !parts.includes(x.t)) parts.push(x.t); }); labels[c] = parts.join(" · "); }
    [...t.rows].forEach(tr=>{ if(tr.classList.contains("hd")) return; let c = 0; [...tr.cells].forEach(td=>{ td.setAttribute("data-label", labels[c]||""); c += td.colSpan||1; }); });
  });
}

const CRC_T = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC_T[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const now = new Date(), dt = ((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1)) & 0xFFFF, dd = (((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate()) & 0xFFFF;
  for(const [name, content] of files){
    const nb = enc.encode(name), data = typeof content==="string"? enc.encode(content) : content, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,dt,true); h.setUint16(12,dd,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,nb.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer), nb, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,dt,true); c.setUint16(14,dd,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true);
    c.setUint16(28,nb.length,true); c.setUint16(30,0,true); c.setUint16(32,0,true); c.setUint16(34,0,true); c.setUint16(36,0,true); c.setUint32(38,0,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer), nb);
    off += 30 + nb.length + data.length;
  }
  const cs = cen.reduce((a,b)=>a+b.length,0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...cen, new Uint8Array(e.buffer)]);
}
function x(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,""); }

function excelDate(s){ const d = pd(s); return d? (d - Date.UTC(1899,11,30))/86400000 : null; }
class XSheet{
  constructor(name){ this.name = name; this.rows = {}; this.merges = []; this.cols = []; this.freeze = null; this.landscape = true; this.maxR = 0; this.maxC = 0; this.cf = null; }
  set(r,c,v,s,f){ (this.rows[r] = this.rows[r]||{})[c] = {v,s,f}; this.maxR = Math.max(this.maxR,r); this.maxC = Math.max(this.maxC,c); return this; }
  row(r, c0, vals, s){ vals.forEach((v,k)=>{ if(v && typeof v==="object" && !Array.isArray(v)) this.set(r,c0+k,v.v,v.s??s,v.f); else this.set(r,c0+k,v,s); }); }
  merge(r1,c1,r2,c2){ this.merges.push(colL(c1)+(r1+1)+":"+colL(c2)+(r2+1)); }
  ref(r,c,abs){ return abs? "$"+colL(c)+"$"+(r+1) : colL(c)+(r+1); }
  xml(){
    let o = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">`;
    o += `<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:${colL(this.maxC)}${this.maxR+1}"/>`;
    o += `<sheetViews><sheetView workbookViewId="0" zoomScale="90">` + (this.freeze? `<pane ySplit="${this.freeze}" topLeftCell="A${this.freeze+1}" activePane="bottomLeft" state="frozen"/>` : "") + `</sheetView></sheetViews>`;
    o += `<sheetFormatPr defaultRowHeight="15"/>`;
    if(this.cols.length) o += `<cols>${this.cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols>`;
    o += `<sheetData>`;
    Object.keys(this.rows).map(Number).sort((a,b)=>a-b).forEach(r=>{
      const R = this.rows[r];
      o += `<row r="${r+1}">`;
      Object.keys(R).map(Number).sort((a,b)=>a-b).forEach(c=>{
        const {v,s,f} = R[c], ref = colL(c)+(r+1), sa = s? ` s="${s}"` : "";
        if(f){
          if(typeof v==="number") o += `<c r="${ref}"${sa}><f>${x(f)}</f><v>${v}</v></c>`;
          else o += `<c r="${ref}"${sa} t="str"><f>${x(f)}</f><v>${x(v??"")}</v></c>`;
        } else if(v===null || v===undefined || v===""){ o += `<c r="${ref}"${sa}/>`; }
        else if(typeof v==="number" && isFinite(v)) o += `<c r="${ref}"${sa}><v>${v}</v></c>`;
        else o += `<c r="${ref}"${sa} t="inlineStr"><is><t xml:space="preserve">${x(v)}</t></is></c>`;
      });
      o += `</row>`;
    });
    o += `</sheetData>`;
    if(this.merges.length) o += `<mergeCells count="${this.merges.length}">${this.merges.map(m=>`<mergeCell ref="${m}"/>`).join("")}</mergeCells>`;
    const rng = `A1:${colL(Math.max(this.maxC,1))}${this.maxR+1}`;
    const okW = ["M","LULUS","MEMENUHI","Sesuai","Terbukti","Ya"], badW = ["TM","GUGUR","TIDAK LULUS","TIDAK MEMENUHI","Tidak Sesuai","Tidak Terbukti","Tidak Hadir"];
    let pr = 1;
    o += `<conditionalFormatting sqref="${rng}">` + okW.map(w=>`<cfRule type="cellIs" dxfId="0" priority="${pr++}" operator="equal"><formula>"${x(w)}"</formula></cfRule>`).join("") + badW.map(w=>`<cfRule type="cellIs" dxfId="1" priority="${pr++}" operator="equal"><formula>"${x(w)}"</formula></cfRule>`).join("") + `</conditionalFormatting>`;
    o += `<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>`;
    o += `<pageSetup paperSize="9" orientation="${this.landscape?"landscape":"portrait"}" fitToWidth="1" fitToHeight="0"/>`;
    o += `<headerFooter><oddFooter>&amp;L&amp;8${x(this.name)}&amp;R&amp;8Hal. &amp;P / &amp;N</oddFooter></headerFooter>`;
    o += `</worksheet>`;
    return o;
  }
}

  }

  /* ---- Sheet 6: Pembuktian ---- */
  const inv = S.peserta.filter(p=>evalResult(p).lulus);
  const pbItems = PB;
  const s6 = new XSheet(NM.pb);
  const c0 = 7; // kolom awal item PB
  s6.cols = [5,28,10,22,24,26].concat([16]).concat(pbItems.map(()=>13)).concat([8,8,8,8,8,8,8,8,9,13,10,13,40]);

  s6.set(0,0,"PEMBUKTIAN KUALIFIKASI",ST.title); s6.merge(0,0,0,6+pbItems.length+13);
  s6.set(1,0,"Tanggal: "+tglID(K.tglPembuktian)+" | Metode: "+K.metodePembuktian+" | Tempat/Media: "+K.tempatPembuktian+". Dasar: IKP 19, Bab VIII huruf F. Pengalaman dihitung ulang hanya dari yang “Terbukti” (kontrak asli & BAST).",ST.note); s6.merge(1,0,1,6+pbItems.length+13);
  const hdr = ["No","Nama Peserta","Kehadiran","Nama Wakil","Jabatan","No. Identitas","Kedudukan Wakil"].concat(pbItems.map(it=>it.t.split(/[:(]/)[0].trim())).concat(["a terbukti","b terbukti","c terbukti","Nilai Kinerja","Nilai a","Nilai b","Nilai c","Nilai d","Jumlah Nilai","Hasil Teknis Setelah Pembuktian","Indikasi Pemalsuan","Hasil Pembuktian","Keterangan"]);
  s6.row(3,0,hdr,ST.hdr);
  s6.row(4,0,hdr.map((h,i)=> i>=c0 && i<c0+pbItems.length ? "("+(i-c0+1)+")" : ""),ST.hdr);
  s6.cols = hdr.map((h,i)=> i===1?28 : i===0?5 : i<c0? 18 : i<c0+pbItems.length? 14 : i===hdr.length-1? 42 : i===hdr.length-4? 14 : 9);
  for(let c=0;c<hdr.length;c++){ if(!(c>=c0 && c<c0+pbItems.length)) s6.merge(3,c,4,c); }
  r = 5;
  const cA = c0+pbItems.length; // kolom a terbukti
  const L = (c)=>colL(c);
  inv.forEach((p,k)=>{
    const R1 = r+1, b = pembuktian(p), t = b.t, no = idx(p)+1;
    s6.set(r,0,no,ST.ctr); s6.set(r,1,pName(p),ST.txt); s6.set(r,2,p.pb.hadir||"",ST.ctr); s6.set(r,3,p.pb.wakil,ST.txt); s6.set(r,4,p.pb.jabatan,ST.txt); s6.set(r,5,p.pb.noId,ST.txt); s6.set(r,6,p.pb.statusWakil,ST.txt);
    pbItems.forEach((it,j)=>{ const v = it.k==="kso" && p.bentuk!=="KSO"? "Tidak Diperlukan" : (p.pb.items[it.k]||""); s6.set(r,c0+j,v,ST.ctr); });
    s6.set(r,cA,t.a,ST.ctr,`COUNTIFS(${er("B")},A${R1},${er("R")},1,${er("U")},"Terbukti")`);
    s6.set(r,cA+1,t.b,ST.ctr,`COUNTIFS(${er("B")},A${R1},${er("S")},1,${er("U")},"Terbukti")`);
    s6.set(r,cA+2,t.c,ST.ctr,`COUNTIFS(${er("B")},A${R1},${er("T")},1,${er("U")},"Terbukti")`);
    s6.set(r,cA+3,isFinite(t.k)?t.k:null,ST.dec);
    const a_=L(cA)+R1, b_=L(cA+1)+R1, c_=L(cA+2)+R1, d_=L(cA+3)+R1;
    s6.set(r,cA+4,t.na,ST.ctr,`IF(${a_}>=10,20,IF(${a_}>=5,10,IF(${a_}>=1,5,0)))`);
    s6.set(r,cA+5,t.nb,ST.ctr,`IF(${b_}>=10,30,IF(${b_}>=5,20,IF(${b_}>=1,10,0)))`);
    s6.set(r,cA+6,t.nc,ST.ctr,`IF(${c_}>=10,40,IF(${c_}>=5,30,IF(${c_}>=1,20,0)))`);
    s6.set(r,cA+7,t.nd,ST.ctr,`IF(ISNUMBER(${d_}),IF(${d_}>=3,10,IF(${d_}>=2,5,0)),0)`);
    s6.set(r,cA+8,t.total,ST.boldCtr,`SUM(${L(cA+4)}${R1}:${L(cA+7)}${R1})`);
    const allA = p.bentuk==="KSO" ? (t.allA==="Ya") : true;
    s6.set(r,cA+9,t.hasil,ST.boldCtr,`IF(AND(${a_}>=1,${b_}>=1,${c_}>=1,${allA?"TRUE":"FALSE"},ISNUMBER(${d_}),${d_}>=${PR.minK},${L(cA+5)}${R1}>=${PR.ambB},${L(cA+6)}${R1}>=${PR.ambC},${L(cA+8)}${R1}>=${PR.ambT}),"LULUS","TIDAK LULUS")`);
    s6.set(r,cA+10,p.pb.pemalsuan?"Ya":"Tidak",ST.ctr);
    const itR = L(c0)+R1+":"+L(c0+pbItems.length-1)+R1;
    const hs = b.hasil==="LULUS"? "LULUS" : b.hasil==="GUGUR"? "GUGUR" : "BELUM DINILAI";
    s6.set(r,cA+11,hs,ST.boldCtr,`IF(C${R1}="","BELUM DINILAI",IF(OR(C${R1}="Tidak Hadir",COUNTIF(${itR},"Tidak Sesuai")>0,${L(cA+10)}${R1}="Ya"),"GUGUR",IF(OR(COUNTBLANK(${itR})>0,COUNTIFS(${er("B")},A${R1},${er("U")},"")>0),"BELUM DINILAI",IF(${L(cA+9)}${R1}="LULUS","LULUS","GUGUR"))))`);
    s6.set(r,cA+12,[...b.reasons, ...pbItems.filter(it=>p.pb.items[it.k+"_ket"]).map(it=>it.t.split(/[:(]/)[0].trim()+": "+p.pb.items[it.k+"_ket"]), p.pb.catatan].filter(Boolean).join("; "),ST.txt);
    r++;

  r++; s6.set(r,1,"Keterangan kolom (1)–("+pbItems.length+"):",ST.lbl); r++;
  pbItems.forEach((it,j)=>{ s6.set(r,1,"("+(j+1)+") "+it.t,ST.note); s6.merge(r,1,r,12); r++; });

  /* ---- Sheet 7: Hasil Akhir ---- */
  const R = ranking();

  s7.set(1,0,K.namaPaket,ST.sub); s7.merge(1,0,1,8);

  r = 4;
  S.peserta.forEach((p,k)=>{
    const row = R.rows[k];

    r++;
  });
  r++; s7.set(r,0,"CALON DAFTAR PENDEK (urut peringkat; nilai sama ditentukan berdasarkan nilai kontrak pekerjaan sejenis tertinggi — IKP 20.2)",ST.lbl); s7.merge(r,0,r,8); r++;
  s7.row(r,0,["Peringkat","Nama Peserta","NPWP","Nilai Teknis","Nilai Sejenis Tertinggi (Rp)","Daftar Pendek","Bentuk"],ST.hdr); r++;
  R.pass.forEach(rw=>{ s7.set(r,0,rw.rank,ST.ctr); s7.set(r,1,pName(rw.p),ST.txt); s7.set(r,2,rw.p.npwp,ST.txt); s7.set(r,3,rw.b.t.total,ST.ctr); s7.set(r,4,rw.b.t.top,ST.num); s7.set(r,5,rw.shortlist?"Ya":"Tidak",ST.ctr); s7.set(r,6,rw.p.bentuk,ST.ctr); r++; });
  if(!R.pass.length){ s7.set(r,1,"Belum ada peserta yang lulus pembuktian.",ST.note); r++; }
  r++;
  const gagal = R.pass.length < P.minLulus;

  s7.set(r,0, gagal? `Peserta lulus pembuktian kualifikasi berjumlah ${R.pass.length} (kurang dari ${P.minLulus}); sesuai IKP 19.10 prakualifikasi dinyatakan GAGAL dan ditindaklanjuti sesuai IKP 23.` : `${R.pass.length} peserta lulus pembuktian kualifikasi; ${Math.min(R.pass.length,P.maxShortlist)} peserta ditetapkan dalam Daftar Pendek sesuai IKP 20.3.`, ST.txt); s7.merge(r,0,r,8); r+=2;
  s7.set(r,5,K.kotaTtd+", "+tglID(K.tglPembuktian||K.tglEvaluasi),ST.def); r++;
  s7.set(r,5,"Pokja Pemilihan",ST.lbl); r++;
  S.pokjaAnggota.forEach((a,k)=>{ s7.set(r,5,(k+1)+". "+(a.nama||"………………………")+" ("+a.jabatan+")",ST.def); s7.set(r,7,"……………………",ST.def); r++; });

  return buildXlsx([s1,s2,s3,s4,s5,s6,s7]);

function wr(text, o={}){
  const f = o.font || DOCFONT;
  const rp_ = (f?`<w:rFonts w:ascii="${x(f)}" w:hAnsi="${x(f)}" w:eastAsia="${x(f)}" w:cs="${x(f)}"/>`:"") + (o.b?"<w:b/>":"") + (o.i?"<w:i/>":"") + (o.caps?"<w:caps/>":"") + (o.color?`<w:color w:val="${o.color}"/>`:"") + (o.sz?`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`:"") + (o.u?'<w:u w:val="single"/>':"");

function wp(runs, o={}){

    (o.bottomBorder?`<w:pBdr><w:bottom w:val="thinThickSmallGap" w:sz="24" w:space="1" w:color="000000"/></w:pBdr>`:"") +
    (o.tabs? `<w:tabs>${o.tabs.map(t=>`<w:tab w:val="${t[1]||"left"}" w:pos="${t[0]}"/>`).join("")}</w:tabs>` : "") +
    `<w:spacing w:before="${o.before||0}" w:after="${o.after??100}" w:line="${o.line||264}" w:lineRule="auto"/>` +
    (o.ind? `<w:ind w:left="${o.ind}" w:hanging="${o.hang||0}"/>` : "") + `<w:jc w:val="${o.align||"both"}"/>` +
    (o.sect? o.sect : "");

/* sel tabel: {t, raw, span, vm, b, i, al, fill} */
function wtable(rows, widths, o={}){
  const tw = widths.reduce((a,b)=>a+b,0);
  const bd = o.noBorder? `<w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>` : `<w:tblBorders><w:top w:val="single" w:sz="4" w:color="000000"/><w:left w:val="single" w:sz="4" w:color="000000"/><w:bottom w:val="single" w:sz="4" w:color="000000"/><w:right w:val="single" w:sz="4" w:color="000000"/><w:insideH w:val="single" w:sz="4" w:color="000000"/><w:insideV w:val="single" w:sz="4" w:color="000000"/></w:tblBorders>`;
  const mar = o.mar ?? 70;
  let t = `<w:tbl><w:tblPr><w:tblW w:w="${tw}" w:type="dxa"/>${o.center?'<w:jc w:val="center"/>':""}${bd}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="${o.noBorder?0:30}" w:type="dxa"/><w:left w:w="${mar}" w:type="dxa"/><w:bottom w:w="${o.noBorder?0:30}" w:type="dxa"/><w:right w:w="${mar}" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>`;
  rows.forEach((row,ri)=>{

    t += `<w:tr><w:trPr>${o.noSplit===false?"":"<w:cantSplit/>"}${isH?"<w:tblHeader/>":""}</w:trPr>`;
    let ci = 0;
    row.forEach(cell=>{
      if(cell==null) cell = "";
      const c = typeof cell==="object"? cell : {t:cell};
      const span = c.span||1, w = widths.slice(ci, ci+span).reduce((a,b)=>a+b,0); ci += span;
      const fill = c.fill || (isH && o.hdrFill ? o.hdrFill : null);

      const content = c.raw || String(c.t??"").split("\n\n").map(par=>wp(wr(par,{b:isH||c.b, i:c.i, sz:c.sz||o.sz||20}), {after:0, line:o.line||240, align: c.al || (isH?"center":"left")})).join("");

    });
    t += `</w:tr>`;
  });
  return t + `</w:tbl>`;
}

}

function fldRun(instr, sz){ const R = `<w:rPr><w:sz w:val="${sz}"/></w:rPr>`; return `<w:r>${R}<w:fldChar w:fldCharType="begin"/></w:r><w:r>${R}<w:instrText xml:space="preserve"> ${instr} </w:instrText></w:r><w:r>${R}<w:fldChar w:fldCharType="separate"/></w:r><w:r>${R}<w:t>1</w:t></w:r><w:r>${R}<w:fldChar w:fldCharType="end"/></w:r>`; }

/* ---------- status helpers ---------- */
const PH = {dok:"Sesuai/Tidak Sesuai", asli:"Ya / Tidak", sal:"Ya / Tidak", sah:"Sah / Tidak"};
const NA = {dok:"-", asli:"-", sal:"-", sah:"-"};
function stPB(p, k){
  const it = p.pb.items, h = it[k];
  if(p.pb.hadir==="Tidak Hadir") return {dok:"Tidak hadir", asli:"-", sal:"-", sah:"Tidak"};
  if(h==="Tidak Diperlukan") return NA;
  if(!h) return PH;
  const ok = h==="Sesuai";
  return {dok:h, asli: it[k+"_asli"] || (ok?"Ya":"Tidak"), sal: it[k+"_salinan"] || (ok?"Ya":"Tidak"), sah: ok && !p.pb.pemalsuan ? "Sah" : "Tidak"};
}
function stAdm(r){ return r==="M"? {dok:"Sesuai", asli:"-", sal:"-", sah:"Sah"} : r==="TM"? {dok:"Tidak Sesuai", asli:"-", sal:"-", sah:"Tidak"} : {dok:PH.dok, asli:"-", sal:"-", sah:PH.sah}; }
function stExp(p, xp){
  if(p.pb.hadir==="Tidak Hadir") return {dok:"Tidak hadir", asli:"-", sal:"-", sah:"Tidak"};
  const b = xp.bukti;
  if(b==="Terbukti") return {dok:"Sesuai", asli:"Ya", sal:"Ya", sah:"Sah"};
  if(b==="Tidak Terbukti") return {dok:"Tidak Sesuai", asli:"Ya", sal:"Tidak", sah:"Tidak"};
  if(b==="Tidak Ditunjukkan") return {dok:"Tidak Sesuai", asli:"Tidak", sal:"Tidak", sah:"Tidak"};
  return PH;
}
function admAll(p, k){ // gabungan hasil admin seluruh badan usaha
  const it = ADM.find(a=>a.k===k); const rs = ents(p).map((e,ei)=>admItem(p,ei,it).r);
  return rs.includes("TM")? "TM" : rs.every(r=>r==="M")? "M" : "-";
}
/* hasil kolom "PEMBUKTIAN DOKUMEN KUALIFIKASI" pada BA */
function resPB(p, keys){
  if(p.pb.hadir==="Tidak Hadir") return "X";
  const v = keys.map(k=>p.pb.items[k]);
  if(v.includes("Tidak Sesuai")) return "TS";
  if(v.every(z=>z==="Tidak Diperlukan")) return "TD";
  if(v.some(z=>!z)) return "";
  return "S";
}
function resTxt(r, extra){
  const base = r==="S"? "SESUAI\n\nDengan Dokumen Pada SPSE" : r==="TS"? "TIDAK SESUAI\n\nDengan Dokumen Pada SPSE" : r==="TD"? "TIDAK DIPERLUKAN" : r==="X"? "TIDAK DAPAT DIBUKTIKAN\n\n(peserta tidak hadir)" : "(SESUAI/TIDAK SESUAI)\n\nDengan Dokumen Pada SPSE";
  return base + (extra? "\n\n" + extra : "");
}
function safeName(s){ return String(s||"peserta").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_").slice(0,60) || "peserta"; }
function noBA(p){ return p.pb.noBA || S.paket.noBAPembuktian || "……/……………/……/" + TA; }
function wakilLines(p){
  if(p.bentuk==="KSO") return p.ents.map(e=>e.nama||"PT ……………………");
  return [p.nama||"PT ……………………"];
}

  row("     - KTP", isDir? `${pb.wakil||""}${pb.jabatan?" ("+pb.jabatan+")":""}${pb.noId? "; NIK "+pb.noId : ""}` : (sw? "-" : ""), isDir? stPB(p,"identitas") : (sw? NA : PH));
  row("     - Bukti kedudukan Direksi dalam Akta / SK RUPS", isDir? sw : (sw? "-" : ""), isDir? stPB(p,"kedudukan") : (sw? NA : PH));
  row("b.  Pegawai Tetap (penerima kuasa)", "", {dok:"",asli:"",sal:"",sah:""});
  const kuasaNo = ((p.ents[0].adm.kuasa)||{}).nomor || "";
  row("     - KTP", isKuasa? `${pb.wakil||""}${pb.noId? "; NIK "+pb.noId : ""}` : (sw? "-" : ""), isKuasa? stPB(p,"identitas") : (sw? NA : PH));
  row("     - Membawa Surat Kuasa", isKuasa? kuasaNo : (sw? "-" : ""), isKuasa? stPB(p,"kedudukan") : (sw? NA : PH));
  row("     - Bukti Pajak Formulir 1721 A1 / BPJS Ketenagakerjaan", isKuasa? "Karyawan tetap" : (sw? "-" : ""), isKuasa? stPB(p,"kedudukan") : (sw? NA : PH));
  if(p.bentuk==="KSO") p.ents.slice(1).forEach(e=>{
    grp("","Pengurus Perusahaan (Anggota KSO: " + (e.nama||"-") + ")","(menunjukkan Kartu Tanda Penduduk/KTP)");
    row("     - KTP Direktur/ Direktur Utama", ((e.adm.ktp)||{}).nomor||"", stPB(p,"identitas"));
  });
  // 2..6 per badan usaha
  ents(p).forEach((e,ei)=>{
    const A = e.adm, ak = A.akta||{}, nib = A.nib||{}, s1 = A.ss1||{}, s2 = A.ss2||{}, sb = A.sbu||{}, kw = A.kswp||{}, spt = A.spt||{};
    if(p.bentuk==="KSO") rows.push(["",{t:(ei===0?"Leadfirm: ":"Anggota KSO: ") + (e.nama||"-"),b:true,i:true,span:6}]);
    grp(p.bentuk==="KSO"? "" : "2","Landasan Hukum Pendirian Perusahaan :");
    row("a.  Akta Pendirian Perusahaan","",{dok:"",asli:"",sal:"",sah:""});
    const sA = stPB(p,"akta");
    row("     - Nomor", ak.pNo || ak.nomor || "", sA); row("     - Tanggal", tglShort(ak.pTgl), sA); row("     - Nama Notaris", ak.pNot||"", sA);
    row("b.  Akta Perubahan Terakhir","",{dok:"",asli:"",sal:"",sah:""});
    row("     - Nomor", ak.uNo||"", sA); row("     - Tanggal", tglShort(ak.uTgl), sA); row("     - Nama Notaris", ak.uNot||"", sA);
    row("c.  Pengesahan/Pemberitahuan Kementerian Hukum (AHU)", ak.ahu||"", sA);
    grp(p.bentuk==="KSO"? "" : "3","NIB","(sesuai dengan yang dipersyaratkan dalam Dokumen Kualifikasi)");
    const sN = stPB(p,"nib");
    row("a.  Nomor", nib.nomor||"", sN); row("b.  Berlaku Sampai", "Selama menjalankan kegiatan usaha", sN); row("c.  Instansi Pemberi", "Lembaga OSS", sN);
    grp(p.bentuk==="KSO"? "" : "4","Sertifikat Standar Terverifikasi (KBLI 2020)","(KBLI 71101 dan KBLI 71102)");
    row("a.  Nomor — KBLI 71101", s1.nomor||"", sN); row("b.  Nomor — KBLI 71102", s2.nomor||"", sN); row("c.  Instansi Pemberi", "Lembaga OSS", sN);
    row("d.  Status verifikasi / Tangkapan Layar OSS (jika belum terverifikasi)", [s1.ada, s2.ada].filter(Boolean).map((v,i)=>(i?"71102: ":"71101: ")+v).join("; ") || "Terverifikasi / Tidak Terverifikasi", sN);
    const sS = stPB(p,"sbu");
    [["AR001","Jasa Arsitektural Bangunan Gedung Hunian dan Non-Hunian",sb.ar,sb.nomor,sb.berlaku],["RK001","Jasa Rekayasa Konstruksi Bangunan Gedung Hunian dan Non Hunian",sb.rk,sb.nomorRK||sb.nomor,sb.berlakuRK||sb.berlaku]].forEach(([kode,nama,has,no,bl])=>{
      grp(p.bentuk==="KSO"? "" : "5","SBU : " + kode + " (B)","(sesuai dengan yang dipersyaratkan dalam Dokumen Kualifikasi)");
      if(sb.kual && !has){ row("     Tidak memiliki subklasifikasi " + kode, p.bentuk==="KSO"? "Saling melengkapi dalam KSO" : "-", p.bentuk==="KSO"? NA : stPB(p,"sbu")); return; }
      row("a.  Nomor", no||"", sS); row("b.  Berlaku Sampai", tglShort(bl), sS); row("c.  Instansi Pemberi", "LPJK", sS);
      row("d.  Kualifikasi", sb.kual? sb.kual : "K / M / B", sS); row("e.  Subbidang Klasifikasi", kode + " — " + nama, sS);
    });
    grp(p.bentuk==="KSO"? "" : "6","Perpajakan :");
    const sP = stPB(p,"pajak");
    row("a.  NPWP", e.npwp || (ei===0? p.npwp : "") || kw.nomor || "", sP);
    row("b.  Pajak Tahun Terakhir (Bukti Lapor SPT Tahunan 2025)", spt.nomor || spt.ada || "", sP);
    row("c.  Konfirmasi Status Wajib Pajak Valid", kw.ada || "Valid / Tidak Valid", sP);
  });
  grp("7","KSO (jika ada) :", p.bentuk==="KSO"? "" : "(tuliskan No. & Tgl. Surat Perjanjian KSO)");
  row("     Mempunyai perjanjian kerja sama operasi (KSO)", p.bentuk==="KSO"? (p.ksoKet||p.ksoAda||"") : "Peserta tunggal — tidak diperlukan", p.bentuk==="KSO"? stPB(p,"kso") : NA);
  grp("8","Surat Pernyataan :");
  const sp = stAdm(admAll(p,"pernyataan"));
  ["Yang bersangkutan dan manajemennya tidak dalam pengawasan pengadilan, tidak pailit, dan kegiatan usahanya tidak sedang dihentikan.","Badan Usaha tidak sedang dikenakan sanksi Daftar Hitam.","Yang bertindak untuk dan atas nama Badan Usaha tidak sedang dalam menjalani sanksi daftar hitam lain.","Keikutsertaan yang bersangkutan tidak menimbulkan pertentangan kepentingan.","Yang bertindak untuk dan atas nama badan usaha tidak sedang dalam menjalani sanksi pidana.","Pimpinan dan pengurus badan usaha bukan sebagai pegawai Kementerian/Lembaga/Perangkat Daerah atau pegawai yang sedang mengambil cuti diluar tanggungan Negara.","Pernyataan lain yang menjadi syarat kualifikasi yang tercantum dalam Dokumen Kualifikasi.","Data kualifikasi yang diisikan benar, dan jika dikemudian hari ditemukan data/dokumen tidak benar dan ada pemalsuan, bersedia dikenakan sanksi administratif, sanksi Daftar Hitam, gugatan perdata, dan/atau pelaporan pidana."].forEach((s,i)=>row(String.fromCharCode(97+i)+")  "+s, "Bagian dari Pakta Integritas/Pernyataan pada SPSE", sp));
  grp("9","Pakta Integritas dan Daftar Hitam :");
  row("a.  Menyetujui Pernyataan Pakta Integritas (huruf a s.d. d) pada SPSE", "Disetujui pada SPSE", stAdm(admAll(p,"pakta")));
  row("b.  Tidak masuk dalam Daftar Hitam (pengecekan portal INAPROC)", "Pernyataan pada SPSE", stAdm(admAll(p,"dh")));
  // B TEKNIS
  sec("B","KUALIFIKASI TEKNIS");
  grp("1","Data Pengalaman Perusahaan :");
  const cat = (label, f)=>{
    rows.push(["",{t:label,b:true},{t:"Nama Paket / Nomor Kontrak / Nilai",b:true,al:"center"},{t:"BAST",b:true,al:"center"},"","",""]);
    const xs = p.exps.filter(xp=>f(expFlags(xp)));
    if(!xs.length) row("     1.", "", PH);
    xs.forEach((xp,i)=> row(`     ${i+1}.  ${xp.nama||"-"}${p.bentuk==="KSO"? " ("+eName(p,+xp.ent)+")" : ""}`, `${xp.noKontrak||"-"}; ${rp(xp.nilai)}${xp.status==="KSO"? " (KSO "+(xp.share||"…")+"%)" : xp.status==="Subkontrak"? " (subkontrak)" : ""}\nBAST/PHO: ${tglShort(xp.tglBAST)||"-"}`, stExp(p,xp)));
  };
  cat("a.  Kontrak Pekerjaan Jasa Konsultansi Konstruksi (4 tahun terakhir)", f=>f.a);
  cat("b.  Kontrak Pekerjaan Sejenis (subklasifikasi AR001/RK001 atau lingkup pekerjaan)", f=>f.b);
  cat("c.  Kontrak Sejenis (10 tahun terakhir) – Jasa Konsultan Perencanaan Konstruksi Pembangunan Gedung Pendidikan", f=>f.c);
  row("d.  Penilaian Kinerja Penyedia (4 tahun terakhir, akumulatif)", isFinite(numPlain(p.kinerja))? `Nilai ${String(p.kinerja).replace(".",",")} — ${p.kinerjaSumber||""}` : "", stPB(p,"kinerja"));
  row("e.  Verifikasi data kualifikasi pada SIKaP", "", stPB(p,"sikap"));
  const topX = p.exps.filter(xp=>{ const f = expFlags(xp); return (f.b||f.c) && +xp.ent===0; }).sort((a,b2)=>expWeighted(b2)-expWeighted(a))[0];
  grp("2","NPT (Nilai Pengalaman Tertinggi pekerjaan sejenis)" + (p.bentuk==="KSO"? " — Leadfirm" : ""));
  row("     Nilai / Nama Paket", topX? `${rp(expWeighted(topX))} — ${topX.nama||"-"}` : "", topX? stExp(p, topX) : PH);
  h += wtable(rows, C, {header:true, headerRows:2, sz, hdrFill:"EDEDED", mar:50, line:228});
  // KESIMPULAN
  const kes = b.hasil==="LULUS"? `Dokumen kualifikasi sesuai dengan dokumen asli. Nilai teknis kualifikasi setelah pembuktian ${t.total} (a ${t.na}; b ${t.nb}; c ${t.nc}; d ${t.nd}). Peserta dinyatakan LULUS pembuktian kualifikasi.`
    : b.hasil==="GUGUR"? `Peserta dinyatakan GUGUR pembuktian kualifikasi: ${b.reasons.join("; ")}.` : "…………………………………………………………………………………………………………";
  h += wp(wr("KESIMPULAN",{b:true,sz:18}) + wr("\t:  " + kes,{sz:18}),{before:160,after:200,align:"left",tabs:[[1600]],ind:1900,hang:1900});
  // TTD
  const wl = wakilLines(p);
  const left = wp(wr("Wakil Penyedia,",{sz:18}),{after:700,align:"left"}) + wl.map((n,k)=>wp(wr(`${k+1}. ${k===0 && pb.wakil? pb.wakil : "……………………………………"}\n    (${n})`,{sz:18}),{after:500,align:"left"})).join("");
  const right = wp(wr(`${K.kotaTtd}, ${tglID(K.tglPembuktian)}`,{sz:18}),{after:0,align:"left"}) + wp(wr("Unit Kerja Pengadaan Barang/ Jasa Kementerian Agama RI",{sz:18}),{after:0,align:"left"}) + wp(wr(K.pokja,{sz:18}),{after:300,align:"left"}) +
    S.pokjaAnggota.map((a,k)=>wp(wr(`${k+1}. ${a.nama||"……………………………"}\t${k+1}. ……………………………`,{sz:18}),{after:260,align:"left",tabs:[[3600]]})).join("");
  h += wtable([[{raw:left},{raw:right}]],[6857, 8000],{noBorder:true, mar:0, noSplit:false});
  return h;
}
function makeBAPeserta(p){
  IMGID = 0;
  const K = S.paket;
  const media = K.useLogo===false? null : b64bytes(K.logo || LOGO_DEFAULT);
  const body = partBA(p, media) + partLampiran(p);
  DOCFONT = null;
  const ftr = `<w:p><w:pPr><w:spacing w:after="0"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:sz w:val="15"/></w:rPr><w:t xml:space="preserve">Hal </w:t></w:r>${fldRun("PAGE",15)}<w:r><w:rPr><w:sz w:val="15"/></w:rPr><w:t xml:space="preserve"> of </w:t></w:r>${fldRun("SECTIONPAGES",15)}</w:p>`;
  const finalSect = `<w:sectPr><w:footerReference w:type="default" r:id="rIdF1"/><w:pgSz w:w="16840" w:h="11910" w:orient="landscape"/><w:pgMar w:top="1000" w:right="1133" w:bottom="640" w:left="850" w:header="0" w:footer="442" w:gutter="0"/><w:pgNumType w:start="1"/></w:sectPr>`;
  return buildDocx(body, finalSect, [ftr], media);
}
function exportBA(pid){
  const p = S.peserta.find(z=>z.id===pid); if(!p) return;
  try{ saveFile("BA_Pembuktian_Kualifikasi_" + safeName(pName(p)) + ".docx", makeBAPeserta(p)); }
  catch(e){ console.error(e); toast("Gagal membuat Berita Acara: " + e.message); }
}
async function exportBAall(){
  const inv = S.peserta.filter(p=>evalResult(p).lulus);
  if(!inv.length){ toast("Belum ada peserta yang diundang pembuktian."); return; }
  try{
    const files = [];
    for(let i=0;i<inv.length;i++){ const blob = makeBAPeserta(inv[i]); files.push([`${String(i+1).padStart(2,"0")}_BA_Pembuktian_${safeName(pName(inv[i]))}.docx`, new Uint8Array(await blob.arrayBuffer())]); }
    saveFile("BA_Pembuktian_Kualifikasi_Per_Peserta.zip", zip(files));
  }catch(e){ console.error(e); toast("Gagal membuat berkas: " + e.message); }
}

  E.ksoAda = "Ada"; KSO_CONTENT.forEach(([k])=>E.ksoIsi[k]=true); E.kinerja = 2.9;

    pbItemsFor(p).forEach(it=>p.pb.items[it.k] = "Sesuai"); p.exps.forEach(xp=>xp.bukti = "Terbukti"); });
